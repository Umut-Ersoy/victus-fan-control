# ==============================================================================
# Configuration File for Victus Fan Control (config.conf)
# ==============================================================================

# Temperature polling interval in seconds
check_interval = 1

# Watchdog keep-alive heartbeat interval in seconds
# Rewrites target speeds to sysfs to refresh EC watchdog even if target hasn't changed
heartbeat_interval = 10

# Default fan speed percentage when temperature is below lowest threshold
default_speed = 0

# Critical temperature threshold in °C (enforces 100% speed on sensor error or >= critical)
temp_critical = 85

# Fan Curve: comma or space separated list of temp_celsius:speed_percentage
# Example: 50:30 means >= 50°C -> 30% speed
fan_curve = 45:30, 50:40, 55:50, 60:60, 65:70, 70:80, 75:85, 80:90, 85:95

# Enable linear interpolation between fan curve points (true/false)
# When true: fan speeds scale smoothly and linearly between curve points
# When false: step-wise discrete thresholds are used
linear_interpolation = true

# Restore BIOS automatic mode on exit (true/false)
restore_auto_on_exit = true

# Colored output in terminal / log (true/false)
enable_colors = true

# Manual Path Overrides (leave empty for dynamic auto-discovery)
override_fan_dir =
override_cpu_temp_file =
